<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Yulux Admin · Login</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0a0a0f; color: #f5f5f7; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 360px; background: #12121a; border: 1px solid #2a2a3a; border-radius: 16px; padding: 32px; }
        h1 { margin: 0 0 4px; font-size: 20px; }
        .brand span { color: #a855f7; }
        p.sub { margin: 0 0 24px; color: #9ca3af; font-size: 13px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #2a2a3a; background: #0a0a0f; color: #f5f5f7; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 999px; background: #a855f7; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
        button:hover { background: #9333ea; }
        .alert { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .alert-error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #f87171; }
        .alert-ok { background: rgba(168,85,247,.1); border: 1px solid rgba(168,85,247,.3); color: #a855f7; }
    </style>
</head>
<body>
<div class="card">
    <h1 class="brand">Yulux<span> Admin</span></h1>
    <p class="sub">Sign in to manage inquiries and site images</p>

    <div th:if="${param.error}" class="alert alert-error">Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-ok">You have been signed out.</div>

    <form th:action="@{/admin/login}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus/>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required/>
        <button type="submit">Sign In</button>
    </form>
</div>
</body>
</html>
