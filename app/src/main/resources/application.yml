server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: yulux-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yulux?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:@liyu5200}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 枚举按 name() 存为字符串，与建表脚本的 VARCHAR 列一致
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: auto

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 20MB

# 自定义应用配置
yulux:
  # admin 接口访问密钥（脚本调用 /api/admin/**，生产环境务必通过环境变量覆盖）
  admin-api-key: ${ADMIN_API_KEY:dev-admin-key-change-me}
  # 后台登录账号（浏览器访问 /admin/**）
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin123}
  # 允许跨域访问的前端来源，逗号分隔
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # 上传图片存储目录（需持久化）
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 后端对外可访问的基础 URL，用于拼接上传图片的绝对地址
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  # 前端站点地址，后台预览默认图（/images/* 静态资源在 Next.js public 目录）
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

logging:
  level:
    com.yulux: debug
