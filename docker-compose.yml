# 生产部署编排：MySQL + Spring Boot 后端 + Caddy（自动 HTTPS 反向代理）
# 前端已部署到 Vercel，不再由本文件管理。
#
# 所有密钥从根目录 .env 注入（模板见 .env.example）：
#   cp .env.example .env  然后修改其中标记（必改）的项
#
# 首次启动前需确认 DNS 已把 API_DOMAIN（如 api.yuluxsign.com）的 A 记录
# 解析到本机公网 IP —— Caddy 申请 Let's Encrypt 证书依赖它。
#
# 本地开发只需数据库：docker compose up -d mysql
# 然后在 app/ 目录 mvn spring-boot:run（默认值与 .env.example 一致，零配置直连）。

services:
  mysql:
    # 8.4 LTS（支持到 2032）。注意 Flyway 需要 flyway-mysql 模块（见 app/pom.xml），
    # 仅 flyway-core 会报 "Unsupported Database"。
    image: mysql:8.4
    container_name: yulux-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yulux}
      MYSQL_USER: ${MYSQL_USER:-yulux_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    # 会话默认时区用 offset 形式（官方镜像未填充 named 时区表，'Asia/Shanghai' 会失效）；
    # 后三项为 1GB 小内存机型瘦身（稳态 ~230MB）：关 performance_schema、缩 buffer pool、限连接数
    command: --default-time-zone=+08:00 --performance-schema=OFF --innodb-buffer-pool-size=64M --max-connections=50
    # 仅绑定本机回环：本地开发（宿主机跑后端）需要连 3306；服务器上不对公网暴露
    # （安全组应只开 22/80/443，此处 loopback 绑定再加一道保险）
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - yulux-net
    healthcheck:
      # 无密码 ping：Access Denied 也视为存活（服务器有响应即 exit 0）；
      # 必须用 127.0.0.1 走 TCP —— localhost 走 unix socket，初始化期间会误报健康
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./app
    container_name: yulux-backend
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-yulux}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: ${MYSQL_USER:-yulux_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?请在 .env 中设置 CORS_ALLOWED_ORIGINS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?请在 .env 中设置 ADMIN_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
      # 适配 1GB 内存机型（RSS ~400MB）；2GB+ 机型可调回 -Xmx512m
      JAVA_OPTS: -Xmx256m
    volumes:
      - uploads:/app/uploads
    # 仅绑定本机回环，供 SSH 隧道/本机调试直连；公网流量一律走 caddy (80/443)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yulux-net
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: yulux-caddy
    environment:
      # 站点域名：{$API_DOMAIN} 在 Caddyfile 解析前做纯文本替换；
      # 未设置时 Caddy 启动即报错（fail-fast，避免带病上线）
      API_DOMAIN: ${API_DOMAIN:?请在 .env 中设置 API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # 证书持久化，防反复签发触发 Let's Encrypt 限额
      - caddy-config:/config
    depends_on:
      - backend
    networks:
      - yulux-net
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  yulux-net:
