services:
  mysql:
    image: mysql:8.0
    container_name: yulux-mysql
    environment:
      MYSQL_ROOT_PASSWORD: yulux_pass
      MYSQL_DATABASE: yulux
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - yulux-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pyulux_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./app
    container_name: yulux-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/yulux?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: yulux_pass
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_API_KEY: change-me-in-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yulux-net

  frontend:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: yulux-frontend
    environment:
      API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - yulux-net

volumes:
  mysql-data:
  uploads:

networks:
  yulux-net:
